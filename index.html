<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<!-- interactive-widget: Android'de klavye açılınca sayfa yüksekliği küçülsün -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0d0a1a">
<title>Trip Ölçer 😾</title>
<meta name="description" content="Sevgilinden gelen mesajı yaz, tribin seviyesini ölç.">
<meta property="og:title" content="Trip Ölçer 😾">
<meta property="og:description" content="Sevgilinden gelen mesajı yaz, tribin seviyesini ölç.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E😾%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body class="level-idle">

  <!-- Ana uygulama alanı: sallanma efekti bu kutuya uygulanır -->
  <div class="app" id="app">

    <header class="header">
      <h1>Trip Ölçer 😾</h1>
      <p class="sub">Sevgilinden gelen mesajı yaz, tribin seviyesini ölç.</p>
      <button id="soundBtn" class="sound-btn" type="button" aria-label="Sesi kapat" aria-pressed="true">🔊</button>
    </header>

    <main class="stage">

      <section class="meter">
        <!-- Yarım daire hız göstergesi (0-100) -->
        <svg class="gauge" viewBox="0 0 200 120" role="img" aria-label="Trip göstergesi">
          <defs>
            <linearGradient id="gaugeGrad" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="180" y2="0">
              <stop offset="0" stop-color="#22c55e"/>
              <stop offset="0.5" stop-color="#facc15"/>
              <stop offset="1" stop-color="#ef4444"/>
            </linearGradient>
          </defs>
          <path class="gauge-track" d="M 20 100 A 80 80 0 0 1 180 100"/>
          <path class="gauge-arc" d="M 20 100 A 80 80 0 0 1 180 100" stroke="url(#gaugeGrad)"/>
          <g id="ticks"></g>
          <!-- İbre: 0 puan = -90°, 100 puan = +90° -->
          <g class="needle" id="needle">
            <polygon points="96.5,100 103.5,100 100,28"/>
          </g>
          <circle class="hub" cx="100" cy="100" r="9"/>
        </svg>

        <p class="score-line">Trip seviyesi: <strong id="score">0</strong></p>
        <p class="level-name" id="levelName" aria-live="polite">Hazır</p>
        <p class="level-text" id="levelText">Mesajı yaz, ibre oynasın.</p>
        <p class="level-extra" id="levelExtra" hidden></p>
      </section>

      <!-- Seviyeye göre meme görseli; dosya yoksa emoji gösterilir -->
      <section class="meme" id="meme" role="img" aria-label="Hazır">
        <img id="memeImg" alt="">
        <span class="meme-emoji" id="memeEmoji" aria-hidden="true">😺</span>
      </section>

    </main>

    <footer class="controls">
      <div class="actions">
        <button id="shareBtn" class="btn-share" type="button" disabled>Sonucu paylaş 📤</button>
        <a id="apologyBtn" class="btn-apology" href="https://ozur.memir.codes" target="_blank" rel="noopener" hidden>Hemen özür dile 🙏</a>
      </div>
      <input id="msg" class="msg" type="text" placeholder="Sevgilinin mesajını yaz…"
             maxlength="140" autocomplete="off" autocapitalize="none" autocorrect="off"
             spellcheck="false" enterkeyhint="done" aria-label="Sevgilinden gelen mesaj">
    </footer>

  </div>

  <!-- Tehlike / PATLAMA: kırmızı yanıp sönen ekran kenarları -->
  <div class="edge-flash" aria-hidden="true"></div>

  <!-- PATLAMA: çatlak cam overlay'i -->
  <svg class="crack" viewBox="0 0 100 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect width="100" height="200" fill="url(#glare)"/>
    <defs>
      <radialGradient id="glare" cx="0.62" cy="0.32" r="0.7">
        <stop offset="0" stop-color="#fff" stop-opacity="0.25"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <g class="crack-lines">
      <polyline points="62,64 48,52 40,30 22,18 6,12"/>
      <polyline points="62,64 78,48 84,26 98,12"/>
      <polyline points="62,64 80,70 100,66"/>
      <polyline points="62,64 72,88 70,120 86,150 82,200"/>
      <polyline points="62,64 50,82 30,92 12,88 0,96"/>
      <polyline points="62,64 56,100 44,140 52,178 40,200"/>
      <polyline points="62,64 36,64 18,52 0,50"/>
      <polyline points="48,52 52,36 46,20 50,0"/>
      <polyline points="78,48 70,36 72,18 66,0"/>
      <polyline points="70,88 90,100 100,120"/>
      <polyline points="30,92 24,116 8,130 0,140"/>
      <polyline points="44,140 28,150 14,170 0,178"/>
      <polyline points="54,58 62,54 70,58 72,68 66,74 56,72 52,64 54,58"/>
      <polyline points="44,46 62,38 82,46 90,66 80,86 58,92 40,80 36,60 44,46"/>
    </g>
  </svg>

  <!-- "Seni seviyorum" kalpleri buraya eklenir -->
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <script src="trips.js"></script>
  <script src="script.js"></script>
</body>
</html>
